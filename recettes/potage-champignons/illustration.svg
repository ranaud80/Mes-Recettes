<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Illustration : bol de velouté aux champignons</title>
  <defs>
    <radialGradient id="fond" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#f4ece1"/><stop offset="1" stop-color="#e3d4bf"/>
    </radialGradient>
    <radialGradient id="soupe" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#e9dcc4"/><stop offset="1" stop-color="#c9b392"/>
    </radialGradient>
    <linearGradient id="bol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f7f73"/><stop offset="1" stop-color="#3f5c52"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3a2410" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#fond)"/>
  <!-- torchon -->
  <g transform="rotate(-8 640 400)">
    <rect x="540" y="300" width="260" height="190" rx="8" fill="#fdf8f0"/>
    <g fill="#5f7f73" opacity=".75">
      <rect x="540" y="330" width="260" height="10"/><rect x="540" y="350" width="260" height="4"/>
      <rect x="540" y="440" width="260" height="10"/><rect x="540" y="460" width="260" height="4"/>
    </g>
  </g>
  <!-- assiette sous le bol -->
  <ellipse cx="360" cy="262" rx="240" ry="200" fill="#f6f1ea" filter="url(#ombre)"/>
  <ellipse cx="360" cy="262" rx="200" ry="166" fill="none" stroke="#e5ddd2" stroke-width="3"/>
  <!-- bol -->
  <circle cx="360" cy="250" r="168" fill="url(#bol)" filter="url(#ombre)"/>
  <circle cx="360" cy="250" r="168" fill="none" stroke="#7e9e92" stroke-width="6"/>
  <circle cx="360" cy="250" r="146" fill="url(#soupe)"/>
  <path d="M250 190 q50 -60 130 -58" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".22"/>
  <path d="M300 250 q20 -50 70 -30 q40 20 10 50 q-30 26 -50 0" fill="none" stroke="#fbf6ec" stroke-width="7" stroke-linecap="round" opacity=".8"/><g transform="translate(330 200) rotate(-12) scale(1.0)"><path d="M-30 4 q0 -34 30 -34 q30 0 30 34 z" fill="#efe2cc" stroke="#b89a72" stroke-width="3"/><path d="M-10 4 h20 v22 q-10 6 -20 0 z" fill="#efe2cc" stroke="#b89a72" stroke-width="3"/><path d="M-22 0 q22 -10 44 0" fill="none" stroke="#c9ad85" stroke-width="2"/></g><g transform="translate(420 290) rotate(18) scale(0.9)"><path d="M-30 4 q0 -34 30 -34 q30 0 30 34 z" fill="#efe2cc" stroke="#b89a72" stroke-width="3"/><path d="M-10 4 h20 v22 q-10 6 -20 0 z" fill="#efe2cc" stroke="#b89a72" stroke-width="3"/><path d="M-22 0 q22 -10 44 0" fill="none" stroke="#c9ad85" stroke-width="2"/></g><g transform="translate(300 310) rotate(6) scale(0.8)"><path d="M-30 4 q0 -34 30 -34 q30 0 30 34 z" fill="#efe2cc" stroke="#b89a72" stroke-width="3"/><path d="M-10 4 h20 v22 q-10 6 -20 0 z" fill="#efe2cc" stroke="#b89a72" stroke-width="3"/><path d="M-22 0 q22 -10 44 0" fill="none" stroke="#c9ad85" stroke-width="2"/></g><g fill="#6b8f3a"><circle cx="400" cy="200" r="4"/><circle cx="414" cy="212" r="3"/><circle cx="392" cy="218" r="3"/></g>
  <!-- cuillère -->
  <g transform="rotate(32 640 150)">
    <rect x="600" y="40" width="16" height="190" rx="8" fill="#c9c2b8"/>
    <ellipse cx="608" cy="250" rx="34" ry="48" fill="#d8d1c7"/>
    <ellipse cx="604" cy="244" rx="12" ry="22" fill="#ffffff" opacity=".45"/>
  </g>
</svg>
