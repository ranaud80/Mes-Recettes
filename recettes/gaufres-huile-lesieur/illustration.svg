<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Illustration : gaufres au sucre glace et pot de confiture</title>
  <defs>
    <radialGradient id="fond" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fbeedd"/>
      <stop offset="1" stop-color="#efd8bc"/>
    </radialGradient>
    <radialGradient id="assiette" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e4dc"/>
    </radialGradient>
    <linearGradient id="gaufre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c26b"/>
      <stop offset="1" stop-color="#d9973c"/>
    </linearGradient>
    <linearGradient id="verre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".25" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="alveoles" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="24" height="24" rx="4" fill="#c27f2c"/>
      <rect x="7" y="7" width="20" height="20" rx="3" fill="#b8721f"/>
    </pattern>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7a4a1c" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#fond)"/>
  <!-- nappe à carreaux discrète -->
  <g opacity=".18" fill="#c0563a">
    <rect x="0" y="0" width="800" height="22"/>
    <rect x="0" y="478" width="800" height="22"/>
  </g>

  <!-- assiette -->
  <ellipse cx="340" cy="270" rx="230" ry="200" fill="url(#assiette)" filter="url(#ombre)"/>
  <ellipse cx="340" cy="270" rx="182" ry="158" fill="none" stroke="#ddd5ca" stroke-width="3"/>

  <!-- gaufre du dessous -->
  <g transform="rotate(-14 330 265)">
    <rect x="200" y="160" width="240" height="190" rx="22" fill="#c98a37" filter="url(#ombre)"/>
  </g>
  <!-- gaufre du dessus -->
  <g transform="rotate(8 345 255)">
    <rect x="215" y="150" width="250" height="200" rx="24" fill="url(#gaufre)" filter="url(#ombre)"/>
    <rect x="238" y="170" width="204" height="170" rx="10" fill="url(#alveoles)"/>
    <rect x="215" y="150" width="250" height="200" rx="24" fill="none" stroke="#e8b25d" stroke-width="6"/>
    <!-- sucre glace -->
    <g fill="#ffffff" opacity=".92">
      <circle cx="260" cy="190" r="4"/><circle cx="290" cy="178" r="3"/><circle cx="318" cy="200" r="5"/>
      <circle cx="350" cy="182" r="3"/><circle cx="378" cy="210" r="4"/><circle cx="410" cy="190" r="3"/>
      <circle cx="430" cy="226" r="4"/><circle cx="270" cy="240" r="3"/><circle cx="300" cy="262" r="5"/>
      <circle cx="336" cy="236" r="4"/><circle cx="362" cy="270" r="3"/><circle cx="398" cy="252" r="5"/>
      <circle cx="420" cy="290" r="3"/><circle cx="252" cy="296" r="4"/><circle cx="286" cy="318" r="3"/>
      <circle cx="326" cy="300" r="4"/><circle cx="356" cy="322" r="3"/><circle cx="392" cy="312" r="4"/>
      <circle cx="244" cy="220" r="2.5"/><circle cx="440" cy="260" r="2.5"/><circle cx="312" cy="170" r="2.5"/>
    </g>
    <path d="M250 175 q60 -20 120 5 q50 20 80 0" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- pot de confiture -->
  <g transform="translate(600 175)">
    <ellipse cx="70" cy="250" rx="78" ry="16" fill="#7a4a1c" opacity=".18"/>
    <rect x="8" y="40" width="124" height="205" rx="26" fill="#9e1f2c"/>
    <rect x="8" y="40" width="124" height="205" rx="26" fill="url(#verre)"/>
    <rect x="22" y="58" width="16" height="150" rx="8" fill="#ffffff" opacity=".35"/>
    <!-- étiquette -->
    <rect x="24" y="120" width="92" height="60" rx="8" fill="#fdf6e9"/>
    <path d="M40 150 h60" stroke="#9e1f2c" stroke-width="3" stroke-linecap="round"/>
    <path d="M48 162 h44" stroke="#c9a98a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- couvercle tissu -->
    <path d="M-4 44 q74 -46 148 0 l-8 14 q-66 -20 -132 0 z" fill="#d94c3d"/>
    <g fill="#ffffff" opacity=".85">
      <circle cx="18" cy="34" r="4"/><circle cx="46" cy="22" r="4"/><circle cx="76" cy="18" r="4"/>
      <circle cx="104" cy="24" r="4"/><circle cx="128" cy="36" r="4"/>
    </g>
    <rect x="2" y="44" width="136" height="12" rx="6" fill="#b83a2e"/>
  </g>

  <!-- cuillère avec confiture -->
  <g transform="rotate(-24 560 400)">
    <rect x="470" y="392" width="150" height="12" rx="6" fill="#c9c3ba"/>
    <ellipse cx="460" cy="398" rx="34" ry="22" fill="#d8d2c9"/>
    <ellipse cx="460" cy="397" rx="24" ry="14" fill="#a8222f"/>
  </g>
</svg>
