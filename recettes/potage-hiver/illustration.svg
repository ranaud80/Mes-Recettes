<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Illustration : bol de potage aux légumes d'hiver</title>
  <defs>
    <radialGradient id="fond" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#eef0e6"/><stop offset="1" stop-color="#d6dbc8"/>
    </radialGradient>
    <radialGradient id="soupe" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#d9c79a"/><stop offset="1" stop-color="#b49a62"/>
    </radialGradient>
    <linearGradient id="bol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a4573a"/><stop offset="1" stop-color="#7d3c25"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3a2410" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#fond)"/>
  <!-- torchon -->
  <g transform="rotate(-8 640 400)">
    <rect x="540" y="300" width="260" height="190" rx="8" fill="#fdf8f0"/>
    <g fill="#7d3c25" opacity=".75">
      <rect x="540" y="330" width="260" height="10"/><rect x="540" y="350" width="260" height="4"/>
      <rect x="540" y="440" width="260" height="10"/><rect x="540" y="460" width="260" height="4"/>
    </g>
  </g>
  <!-- assiette sous le bol -->
  <ellipse cx="360" cy="262" rx="240" ry="200" fill="#f6f1ea" filter="url(#ombre)"/>
  <ellipse cx="360" cy="262" rx="200" ry="166" fill="none" stroke="#e5ddd2" stroke-width="3"/>
  <!-- bol -->
  <circle cx="360" cy="250" r="168" fill="url(#bol)" filter="url(#ombre)"/>
  <circle cx="360" cy="250" r="168" fill="none" stroke="#c27454" stroke-width="6"/>
  <circle cx="360" cy="250" r="146" fill="url(#soupe)"/>
  <path d="M250 190 q50 -60 130 -58" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".22"/>
  <circle cx="320" cy="210" r="20" fill="#e6efc4" stroke="#7fae4a" stroke-width="4"/><circle cx="320" cy="210" r="12" fill="none" stroke="#b7cf7f" stroke-width="2"/><circle cx="420" cy="250" r="17" fill="#e6efc4" stroke="#7fae4a" stroke-width="4"/><circle cx="420" cy="250" r="9" fill="none" stroke="#b7cf7f" stroke-width="2"/><circle cx="350" cy="320" r="15" fill="#e6efc4" stroke="#7fae4a" stroke-width="4"/><circle cx="350" cy="320" r="7" fill="none" stroke="#b7cf7f" stroke-width="2"/><rect x="390" y="180" width="20" height="20" rx="4" fill="#f0943b" transform="rotate(15 400 190)" stroke="#00000022" stroke-width="2"/><rect x="280" y="270" width="20" height="20" rx="4" fill="#f0943b" transform="rotate(-10 290 280)" stroke="#00000022" stroke-width="2"/><rect x="440" y="320" width="20" height="20" rx="4" fill="#f0943b" transform="rotate(30 450 330)" stroke="#00000022" stroke-width="2"/><rect x="380" y="300" width="20" height="20" rx="4" fill="#efe8d6" transform="rotate(8 390 310)" stroke="#00000022" stroke-width="2"/><rect x="300" y="330" width="20" height="20" rx="4" fill="#efe8d6" transform="rotate(-20 310 340)" stroke="#00000022" stroke-width="2"/><rect x="450" y="210" width="20" height="20" rx="4" fill="#efe8d6" transform="rotate(40 460 220)" stroke="#00000022" stroke-width="2"/><g fill="#3c2a1a"><circle cx="360" cy="260" r="2.5"/><circle cx="410" cy="280" r="2"/><circle cx="330" cy="250" r="2"/></g>
  <!-- cuillère -->
  <g transform="rotate(32 640 150)">
    <rect x="600" y="40" width="16" height="190" rx="8" fill="#c9c2b8"/>
    <ellipse cx="608" cy="250" rx="34" ry="48" fill="#d8d1c7"/>
    <ellipse cx="604" cy="244" rx="12" ry="22" fill="#ffffff" opacity=".45"/>
  </g>
</svg>
