nom: Gâteau à l'ananas extra moelleux
auteur: Amélie Martin
source: https://www.lesgourmandisesdenemo.com/gateau-a-lananas-extra-moelleux
source_nom: Les Gourmandises de Némo
description: Gâteau renversé à l'ananas sur lit de caramel, imbibé de jus d'ananas après cuisson.
categorie: Dessert
mots_cles: [internet, gâteau, ananas, caramel, gâteau renversé]
portions:        # non précisé par la source
preparation:     # minutes, non précisé
cuisson: 35      # minutes (30 à 35 min)

ingredients:
  - 130 g de sucre (pour le caramel)
  - 1 boîte d'ananas en tranches (560 g avec le jus)
  - 100 g de sucre (pour la pâte)
  - 100 g de beurre
  - 150 g de farine
  - 1 sachet de levure chimique
  - 3 œufs
  - 2 c. à soupe de rhum (facultatif)

# Étapes reformulées d'après la source
etapes:
  - "Caramel : faites fondre les 130 g de sucre à sec dans une casserole, à feu moyen (3 à 4 min), en remuant si besoin. Arrêtez dès qu'il est blond doré et versez-le aussitôt au fond et sur les bords du moule. Attention aux brûlures."
  - Préchauffez le four à 180 °C.
  - Égouttez les tranches d'ananas en conservant tout le jus, puis disposez-les sur le caramel au fond du moule.
  - Faites fondre le beurre et fouettez-le avec les 100 g de sucre jusqu'à ce que le mélange blanchisse et mousse. Incorporez les œufs un par un.
  - Ajoutez la farine et la levure, mélangez jusqu'à obtenir une pâte lisse, puis ajoutez 5 c. à soupe de jus d'ananas.
  - Versez la pâte sur l'ananas et enfournez 30 à 35 min.
  - Laissez reposer 5 min, puis démoulez sur le plat de service.
  - Piquez le gâteau à la fourchette en plusieurs endroits et arrosez-le en plusieurs fois avec le reste du jus d'ananas (additionné du rhum si vous en mettez).
  - Servez tiède ou froid.

notes:
  - "La source ne précise pas la taille du moule : un moule rond d'environ 24 cm (moule à manqué) convient à ces quantités."
  - "Vérifier la cuisson avec la pointe d'un couteau, qui doit ressortir sèche."

questions:
