<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Illustration : gâteau renversé à l'ananas caramélisé</title>
  <defs>
    <radialGradient id="fond" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fdf3e1"/><stop offset="1" stop-color="#efd9b4"/>
    </radialGradient>
    <radialGradient id="dessus" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e9a443"/><stop offset="1" stop-color="#b8661c"/>
    </radialGradient>
    <linearGradient id="flanc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c27022"/><stop offset=".25" stop-color="#e8b765"/><stop offset="1" stop-color="#d9a250"/>
    </linearGradient>
    <radialGradient id="ananas" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f0b42c"/>
    </radialGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#5a3510" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#fond)"/>

  <!-- plat de service -->
  <ellipse cx="400" cy="345" rx="330" ry="110" fill="#ffffff" filter="url(#ombre)"/>
  <ellipse cx="400" cy="340" rx="290" ry="92" fill="none" stroke="#ece4d8" stroke-width="4"/>

  <!-- flanc du gâteau -->
  <path d="M150 230 v90 a250 82 0 0 0 500 0 v-90 z" fill="url(#flanc)"/>
  <!-- bord caramélisé qui coule -->
  <path d="M150 232 a250 82 0 0 0 500 0 v14 q-12 10 -20 0 q-14 22 -26 4 q-20 30 -40 6 q-30 24 -52 8 q-40 22 -70 6 q-40 18 -80 2 q-30 14 -60 -4 q-24 16 -44 -4 q-26 14 -40 -6 q-18 14 -28 -6 q-14 10 -20 -6 z" fill="#b25d17" opacity=".9"/>
  <!-- dessus -->
  <ellipse cx="400" cy="230" rx="250" ry="82" fill="url(#dessus)"/>

  <!-- tranches d'ananas -->
  <g stroke="#d48e1c" stroke-width="3">
    <g fill="url(#ananas)">
      <ellipse cx="400" cy="230" rx="62" ry="24"/>
      <ellipse cx="265" cy="214" rx="58" ry="21"/>
      <ellipse cx="535" cy="214" rx="58" ry="21"/>
      <ellipse cx="300" cy="262" rx="58" ry="21"/>
      <ellipse cx="500" cy="262" rx="58" ry="21"/>
      <ellipse cx="400" cy="183" rx="55" ry="18"/>
    </g>
    <g fill="#b8661c">
      <ellipse cx="400" cy="230" rx="16" ry="6"/>
      <ellipse cx="265" cy="214" rx="15" ry="5.5"/>
      <ellipse cx="535" cy="214" rx="15" ry="5.5"/>
      <ellipse cx="300" cy="262" rx="15" ry="5.5"/>
      <ellipse cx="500" cy="262" rx="15" ry="5.5"/>
      <ellipse cx="400" cy="183" rx="14" ry="5"/>
    </g>
  </g>
  <!-- reflets de caramel -->
  <g fill="#ffffff" opacity=".35">
    <ellipse cx="370" cy="222" rx="18" ry="4"/><ellipse cx="240" cy="207" rx="14" ry="3"/>
    <ellipse cx="510" cy="207" rx="14" ry="3"/><ellipse cx="380" cy="177" rx="12" ry="3"/>
  </g>

  <!-- part posée devant -->
  <g transform="translate(560 380)">
    <path d="M0 0 l120 -18 l0 34 l-120 18 z" fill="#e8b765"/>
    <path d="M0 0 l120 -18 l-46 -40 z" fill="#c9782a"/>
    <path d="M0 0 l0 34 l120 -18" fill="none" stroke="#c27022" stroke-width="3"/>
    <path d="M20 -6 q30 -16 56 -6" fill="none" stroke="#ffd96a" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- fourchette -->
  <g transform="rotate(-18 150 420)">
    <rect x="70" y="414" width="150" height="10" rx="5" fill="#c9c2b8"/>
    <path d="M220 410 h40 M220 416 h42 M220 422 h42 M220 428 h40" stroke="#c9c2b8" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
