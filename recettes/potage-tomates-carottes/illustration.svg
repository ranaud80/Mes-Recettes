<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Illustration : bol de potage tomates-carottes au basilic</title>
  <defs>
    <radialGradient id="fond" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fbefe4"/><stop offset="1" stop-color="#f0d6c2"/>
    </radialGradient>
    <radialGradient id="soupe" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f58a3c"/><stop offset="1" stop-color="#d4501f"/>
    </radialGradient>
    <linearGradient id="bol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/><stop offset="1" stop-color="#ddd4c7"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3a2410" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#fond)"/>
  <!-- torchon -->
  <g transform="rotate(-8 640 400)">
    <rect x="540" y="300" width="260" height="190" rx="8" fill="#fdf8f0"/>
    <g fill="#d4501f" opacity=".75">
      <rect x="540" y="330" width="260" height="10"/><rect x="540" y="350" width="260" height="4"/>
      <rect x="540" y="440" width="260" height="10"/><rect x="540" y="460" width="260" height="4"/>
    </g>
  </g>
  <!-- assiette sous le bol -->
  <ellipse cx="360" cy="262" rx="240" ry="200" fill="#f6f1ea" filter="url(#ombre)"/>
  <ellipse cx="360" cy="262" rx="200" ry="166" fill="none" stroke="#e5ddd2" stroke-width="3"/>
  <!-- bol -->
  <circle cx="360" cy="250" r="168" fill="url(#bol)" filter="url(#ombre)"/>
  <circle cx="360" cy="250" r="168" fill="none" stroke="#ece4d8" stroke-width="6"/>
  <circle cx="360" cy="250" r="146" fill="url(#soupe)"/>
  <path d="M250 190 q50 -60 130 -58" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".22"/>
  <path d="M300 250 q20 -50 70 -30 q40 20 10 50 q-30 26 -50 0" fill="none" stroke="#fde3cf" stroke-width="7" stroke-linecap="round" opacity=".8"/><g transform="translate(350 220) rotate(-20)"><path d="M0 0 q22 -26 46 0 q-24 24 -46 0z" fill="#3f8f3a"/><path d="M2 0 h40" stroke="#2c6a28" stroke-width="2"/></g><g transform="translate(380 214) rotate(30)"><path d="M0 0 q22 -26 46 0 q-24 24 -46 0z" fill="#4ea047"/><path d="M2 0 h40" stroke="#2c6a28" stroke-width="2"/></g><g transform="translate(364 236) rotate(100)"><path d="M0 0 q22 -26 46 0 q-24 24 -46 0z" fill="#37803a"/><path d="M2 0 h40" stroke="#2c6a28" stroke-width="2"/></g><circle cx="290" cy="300" r="16" fill="#f39a3f" stroke="#d76f1f" stroke-width="3"/><circle cx="290" cy="300" r="7" fill="none" stroke="#d76f1f" stroke-width="2" opacity=".6"/><circle cx="440" cy="290" r="14" fill="#f39a3f" stroke="#d76f1f" stroke-width="3"/><circle cx="440" cy="290" r="6" fill="none" stroke="#d76f1f" stroke-width="2" opacity=".6"/>
  <!-- cuillère -->
  <g transform="rotate(32 640 150)">
    <rect x="600" y="40" width="16" height="190" rx="8" fill="#c9c2b8"/>
    <ellipse cx="608" cy="250" rx="34" ry="48" fill="#d8d1c7"/>
    <ellipse cx="604" cy="244" rx="12" ry="22" fill="#ffffff" opacity=".45"/>
  </g>
</svg>
