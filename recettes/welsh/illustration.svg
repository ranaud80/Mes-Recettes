<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Illustration : welsh gratiné avec œuf au plat, bière blonde et frites</title>
  <defs>
    <linearGradient id="bois" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="1" stop-color="#6e4426"/>
    </linearGradient>
    <radialGradient id="fromage" cx="45%" cy="42%" r="65%">
      <stop offset="0" stop-color="#ffc24a"/>
      <stop offset=".7" stop-color="#f19a26"/>
      <stop offset="1" stop-color="#c8661a"/>
    </radialGradient>
    <radialGradient id="jaune" cx="40%" cy="38%" r="60%">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f29b0c"/>
    </radialGradient>
    <linearGradient id="biere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#d98e12"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b1708" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- table en bois -->
  <rect width="800" height="500" fill="url(#bois)"/>
  <g stroke="#5c391f" stroke-width="3" opacity=".5">
    <path d="M0 120 H800"/><path d="M0 250 H800"/><path d="M0 380 H800"/>
  </g>
  <g stroke="#9c6a40" stroke-width="2" fill="none" opacity=".4">
    <path d="M60 60 q80 -10 160 6"/><path d="M420 190 q90 -12 200 4"/><path d="M120 330 q70 10 150 -4"/>
    <path d="M560 440 q80 -8 180 6"/>
  </g>

  <!-- set de table -->
  <rect x="70" y="50" width="520" height="400" rx="18" fill="#efe3cf" opacity=".95"/>

  <!-- plat à gratin -->
  <g filter="url(#ombre)">
    <ellipse cx="330" cy="255" rx="225" ry="160" fill="#4a2a17"/>
    <ellipse cx="330" cy="250" rx="225" ry="160" fill="#7b3f1f"/>
  </g>
  <!-- oreilles du plat -->
  <ellipse cx="96" cy="250" rx="26" ry="38" fill="#7b3f1f"/>
  <ellipse cx="564" cy="250" rx="26" ry="38" fill="#7b3f1f"/>
  <ellipse cx="330" cy="250" rx="195" ry="134" fill="#5a2c14"/>

  <!-- fromage fondu -->
  <path d="M150 250 q0 -112 180 -118 q182 6 182 118 q-6 112 -182 116 q-176 -4 -180 -116z" fill="url(#fromage)"/>
  <!-- bords gratinés -->
  <g fill="#b9541a" opacity=".75">
    <ellipse cx="185" cy="190" rx="22" ry="10" transform="rotate(-30 185 190)"/>
    <ellipse cx="470" cy="180" rx="26" ry="10" transform="rotate(25 470 180)"/>
    <ellipse cx="480" cy="320" rx="22" ry="9" transform="rotate(-25 480 320)"/>
    <ellipse cx="190" cy="318" rx="24" ry="9" transform="rotate(28 190 318)"/>
    <ellipse cx="330" cy="140" rx="30" ry="7"/>
    <ellipse cx="330" cy="362" rx="28" ry="7"/>
  </g>
  <!-- bulles -->
  <g fill="#ffd77a" opacity=".85">
    <circle cx="220" cy="230" r="7"/><circle cx="250" cy="300" r="5"/><circle cx="430" cy="230" r="6"/>
    <circle cx="410" cy="300" r="8"/><circle cx="270" cy="185" r="4"/><circle cx="455" cy="265" r="4"/>
    <circle cx="205" cy="275" r="4"/><circle cx="380" cy="175" r="5"/>
  </g>

  <!-- œuf au plat -->
  <path d="M260 240 q-6 -58 64 -62 q50 -6 82 26 q34 30 6 70 q-24 34 -84 30 q-62 -6 -68 -64z" fill="#fffdf6"/>
  <circle cx="335" cy="242" r="34" fill="url(#jaune)"/>
  <circle cx="324" cy="230" r="9" fill="#fff3c4" opacity=".8"/>

  <!-- poivre -->
  <g fill="#2c1b10">
    <circle cx="300" cy="200" r="2"/><circle cx="372" cy="214" r="2.2"/><circle cx="350" cy="282" r="1.8"/>
    <circle cx="282" cy="268" r="2"/><circle cx="398" cy="258" r="1.8"/><circle cx="240" cy="210" r="2"/>
    <circle cx="420" cy="205" r="2"/><circle cx="230" cy="320" r="1.8"/><circle cx="440" cy="330" r="2"/>
  </g>

  <!-- verre de bière -->
  <g transform="translate(640 22) scale(.82)">
    <ellipse cx="65" cy="372" rx="62" ry="14" fill="#2b1708" opacity=".3"/>
    <path d="M10 40 L120 40 L108 360 Q65 372 22 360 Z" fill="url(#biere)"/>
    <path d="M10 40 L120 40 L108 360 Q65 372 22 360 Z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
    <rect x="28" y="70" width="12" height="270" rx="6" fill="#fff" opacity=".28"/>
    <g fill="#fff6d6" opacity=".7">
      <circle cx="60" cy="300" r="3"/><circle cx="80" cy="250" r="2.5"/><circle cx="66" cy="200" r="2"/>
      <circle cx="90" cy="160" r="2.5"/><circle cx="58" cy="130" r="2"/>
    </g>
    <!-- mousse -->
    <path d="M4 44 q8 -34 36 -26 q12 -24 40 -12 q26 -14 40 14 q10 4 6 24 z" fill="#fffaf0"/>
  </g>

  <!-- cornet de frites -->
  <g transform="translate(598 365)">
    <g fill="#f5c451" stroke="#d99a2b" stroke-width="2">
      <rect x="40" y="-10" width="14" height="70" rx="4" transform="rotate(-12 47 25)"/>
      <rect x="62" y="-22" width="14" height="80" rx="4" transform="rotate(-3 69 18)"/>
      <rect x="84" y="-14" width="14" height="72" rx="4" transform="rotate(8 91 22)"/>
      <rect x="104" y="-4" width="14" height="62" rx="4" transform="rotate(16 111 27)"/>
      <rect x="52" y="-2" width="14" height="60" rx="4" transform="rotate(4 59 28)"/>
    </g>
    <path d="M24 40 L150 40 L118 130 L56 130 Z" fill="#f4efe6"/>
    <path d="M24 40 L150 40 L144 58 L30 58 Z" fill="#c0392b"/>
    <path d="M40 76 h96 M48 96 h78" stroke="#c0392b" stroke-width="4" opacity=".6"/>
  </g>
</svg>
